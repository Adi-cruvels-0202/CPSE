# Render Blueprint — both halves of CPSE, declared in one place.
#
# Render reads this file from the repo root and creates the services described
# below. Everything here is on the free tier, which has one consequence worth
# knowing before you show anyone the link: a free web service sleeps after 15
# minutes with no traffic and takes roughly 50 seconds to wake. The first request
# after a quiet spell looks like a broken app. The static site never sleeps.
#
# Values marked `sync: false` are deliberately not in this file. Render prompts
# for them on first deploy and stores them itself, so the service-role key and
# the webhook secret never enter the repository.

services:
  # ---------------------------------------------------------------- the API ---
  - type: web
    name: cpse-api
    runtime: node
    plan: free
    # Closest Render region to India. It has to match the static site's region
    # only for latency's sake, not for correctness.
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    # NOT "/" — the app mounts everything under /api/v1, so a health check on the
    # root would fail forever and Render would keep restarting a healthy service.
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production

      # Supabase. The service-role key bypasses RLS entirely, so it is entered in
      # the dashboard and never written down here.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # The browser's origin, for CORS, and the two places Supabase and the mock
      # payment screen send people back to. All three are the static site's URL,
      # which you will know only after its first deploy — hence `sync: false`.
      - key: CORS_ORIGINS
        sync: false
      - key: PASSWORD_RESET_REDIRECT_URL
        sync: false
      - key: PAYMENT_MOCK_CHECKOUT_URL
        sync: false

      # Signs payment webhooks. Generated by Render rather than chosen by hand,
      # because a guessable one lets anyone mark an order paid.
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true

      # The endpoint that walks an order through its statuses without a merchant.
      # The app refuses to boot in production if this is true, which is the point.
      - key: ENABLE_TEST_ENDPOINTS
        value: false

      - key: LOG_LEVEL
        value: info

  # ----------------------------------------------------------- the frontend ---
  - type: web
    name: cpse
    runtime: static
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Vite reads this at BUILD time and bakes it into the bundle. Changing it
      # therefore needs a redeploy, not a restart.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # A single-page app has one real file. Without this, every URL except the
      # homepage is a 404 on reload and every shared link is broken.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        # Vite fingerprints these filenames, so a change produces a new name and
        # a stale cache is impossible. Anything under /assets can be kept forever.
        value: public, max-age=31536000, immutable
